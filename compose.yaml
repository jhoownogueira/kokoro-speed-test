services:
  kokoro:
    image: hangrylabs/kokorotts:v0.2
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:7860/tts/status', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "9595"
      KOKORO_URL: http://kokoro:7860
    ports:
      - "${APP_PORT:-9595}:9595"
    depends_on:
      kokoro:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:9595/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
