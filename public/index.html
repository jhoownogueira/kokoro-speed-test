<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kokoro Voice Lab</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,"Segoe UI",sans-serif; background:#0f1115; color:#eef1f5; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(820px,100%); background:#171a21; border:1px solid #2a2f3a; border-radius:18px; padding:24px; box-shadow:0 18px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 6px; font-size:28px; }
    .subtitle { color:#aab2c0; margin-bottom:22px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:block; color:#cbd2dc; font-size:14px; margin-bottom:6px; }
    select, textarea { width:100%; border:1px solid #343b49; border-radius:10px; background:#0f1218; color:#fff; padding:12px; font:inherit; outline:none; }
    textarea { min-height:145px; resize:vertical; margin-top:14px; font-size:17px; }
    select:focus, textarea:focus { border-color:#7988ff; }
    .speedbox { margin-top:14px; padding:12px; background:#101319; border:1px solid #292f3a; border-radius:10px; }
    .speedrow { display:flex; align-items:center; gap:14px; }
    input[type=range] { width:100%; }
    #speedValue { min-width:48px; font-weight:800; font-size:18px; }
    .actions { display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; }
    button { border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:700; cursor:pointer; background:#7c89ff; color:white; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { margin-top:18px; border-radius:12px; background:#101319; border:1px solid #292f3a; padding:14px; color:#c8cfda; line-height:1.6; }
    .metric { font-size:30px; font-weight:800; color:#fff; }
    .ok { color:#74dda1; } .error { color:#ff8585; white-space:pre-wrap; }
    audio { width:100%; margin-top:16px; }
    small { color:#8e98a8; }
    @media(max-width:650px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<main class="card">
  <h1>Kokoro Voice Lab</h1>
  <div class="subtitle">Teste idioma, voz e velocidade.</div>

  <div class="grid">
    <div>
      <label for="language">Idioma</label>
      <select id="language">
        <option value="pt-BR">🇧🇷 Português (Brasil)</option>
        <option value="en-US">🇺🇸 English (US)</option>
        <option value="es-ES">🇪🇸 Español</option>
      </select>
    </div>
    <div>
      <label for="voice">Voz</label>
      <select id="voice"></select>
    </div>
  </div>

  <div class="speedbox">
    <label for="speed">Velocidade</label>
    <div class="speedrow">
      <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="0.85" />
      <span id="speedValue">0.85x</span>
    </div>
  </div>

  <textarea id="text"></textarea>

  <div class="actions">
    <button id="speak">Gerar e ouvir</button>
    <span id="health">Verificando Kokoro...</span>
  </div>

  <div class="status">
    <div>Tempo para o áudio ficar pronto:</div>
    <div class="metric" id="time">—</div>
    <small>A primeira geração de um idioma pode ser mais lenta por causa do carregamento do pipeline.</small>
    <div id="message"></div>
  </div>

  <audio id="audio" controls></audio>
</main>

<script>
const VOICES = {
  "pt-BR": [
    { id: "pf_dora", label: "♀ Dora" },
    { id: "pm_alex", label: "♂ Alex" },
    { id: "pm_santa", label: "♂ Santa" }
  ],
  "en-US": [
    { id: "af_heart", label: "♀ Heart" },
    { id: "af_bella", label: "♀ Bella" },
    { id: "af_nova", label: "♀ Nova" },
    { id: "am_adam", label: "♂ Adam" },
    { id: "am_michael", label: "♂ Michael" },
    { id: "am_liam", label: "♂ Liam" }
  ],
  "es-ES": [
    { id: "ef_dora", label: "♀ Dora" },
    { id: "em_alex", label: "♂ Alex" },
    { id: "em_santa", label: "♂ Santa" }
  ]
};

const SAMPLES = {
  "pt-BR": "Senha PED-027. Dirigir-se ao guichê 02.",
  "en-US": "Ticket PED-027. Please proceed to counter 02.",
  "es-ES": "Turno PED-027. Diríjase a la ventanilla 02."
};

const language = document.getElementById("language");
const voice = document.getElementById("voice");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
const text = document.getElementById("text");
const button = document.getElementById("speak");
const time = document.getElementById("time");
const message = document.getElementById("message");
const audio = document.getElementById("audio");
const health = document.getElementById("health");

function updateVoices() {
  voice.innerHTML = "";
  for (const item of VOICES[language.value]) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.label;
    voice.appendChild(option);
  }
  text.value = SAMPLES[language.value];
}

language.addEventListener("change", updateVoices);
speed.addEventListener("input", () => speedValue.textContent = `${Number(speed.value).toFixed(2)}x`);

button.addEventListener("click", async () => {
  if (!text.value.trim()) return;
  button.disabled = true;
  button.textContent = "Gerando...";
  time.textContent = "...";
  message.textContent = "";
  message.className = "";

  const start = performance.now();

  try {
    const response = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: text.value.trim(),
        voice: voice.value,
        speed: Number(speed.value)
      })
    });

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error([data.error, data.details, data.hint].filter(Boolean).join("\n"));
    }

    const blob = await response.blob();
    const totalMs = Math.round(performance.now() - start);
    const serverMs = response.headers.get("X-Generation-Time-Ms");

    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(blob);

    time.textContent = `${totalMs} ms`;
    message.textContent = `Voz: ${voice.value} • Velocidade: ${speed.value}x` +
      (serverMs ? ` • Kokoro/servidor: ${serverMs} ms` : "");

    await audio.play();
  } catch (error) {
    time.textContent = "Falhou";
    message.textContent = error.message;
    message.className = "error";
  } finally {
    button.disabled = false;
    button.textContent = "Gerar e ouvir";
  }
});

async function checkHealth() {
  try {
    const response = await fetch("/health");
    const data = await response.json();
    health.textContent = data.kokoro === "ok" ? "● Kokoro conectado" : "● Kokoro não conectado";
    health.className = data.kokoro === "ok" ? "ok" : "error";
  } catch {
    health.textContent = "● Erro ao verificar serviço";
    health.className = "error";
  }
}

updateVoices();
checkHealth();
</script>
</body>
</html>
